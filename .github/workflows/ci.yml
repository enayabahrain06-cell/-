name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ahl_alquran_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahl_alquran_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite, pdo_mysql, pdo_pgsql, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure database (sqlite)
        if: matrix.db == 'sqlite'
        run: |
          echo "DB_CONNECTION=sqlite" >> $GITHUB_ENV
          echo "DB_DATABASE=:memory:" >> $GITHUB_ENV

      - name: Configure database (mysql)
        if: matrix.db == 'mysql'
        run: |
          echo "DB_CONNECTION=mysql" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV
          echo "DB_DATABASE=ahl_alquran_test" >> $GITHUB_ENV
          echo "DB_USERNAME=root" >> $GITHUB_ENV
          echo "DB_PASSWORD=root" >> $GITHUB_ENV

      - name: Configure database (pgsql)
        if: matrix.db == 'pgsql'
        run: |
          echo "DB_CONNECTION=pgsql" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV
          echo "DB_DATABASE=ahl_alquran_test" >> $GITHUB_ENV
          echo "DB_USERNAME=postgres" >> $GITHUB_ENV
          echo "DB_PASSWORD=postgres" >> $GITHUB_ENV

      - name: Migrate, roll back, migrate again, seed
        if: matrix.db != 'sqlite'
        shell: bash
        run: |
          set -o pipefail
          { php artisan migrate:fresh --force && php artisan migrate:rollback --force && php artisan migrate --force --seed; } 2>&1 | tee ../ci-output.txt

      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          php artisan test --compact 2>&1 | tee ../ci-output.txt

      # The failing step's last lines as an annotation, readable without opening the job log.
      - name: Report failure output
        if: failure()
        shell: bash
        working-directory: .
        run: |
          [ -f ci-output.txt ] || exit 0
          tail -n 60 ci-output.txt | sed 's/\x1b\[[0-9;]*m//g' | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' > ci-tail.txt
          echo "::error title=Backend (${{ matrix.db }}) output::$(cat ci-tail.txt)"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        # The error also goes out as an annotation, readable without opening the job log.
        run: |
          cp .env.production.example .env
          docker compose version
          if ! docker compose --profile mysql --profile pgsql --profile whatsapp config -q 2> compose-error.txt; then
            cat compose-error.txt
            echo "::error title=docker compose config::$(tr '\n' ' ' < compose-error.txt)"
            exit 1
          fi
      - name: Build backend, web and whatsapp images
        run: docker compose --profile whatsapp build
