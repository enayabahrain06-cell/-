server {
    listen 80;
    server_name _;
    client_max_body_size 55m;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Laravel: API, signed media and certificate links, API docs, health check.
    location ~ ^/(api|media|docs|up)(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 120s;
    }

    # Public uploads (storage/app/public, shared volume).
    location /storage/ {
        alias /var/www/storage-public/;
        expires 7d;
    }

    # Hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React router: every other path is the SPA.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
