<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F3B33" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable app (PWA): manifest, home-screen icons, full-screen on iOS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="أهل القرآن" />
    <meta name="application-name" content="أهل القرآن" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&family=Amiri+Quran&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Fetch the UI faces as soon as the font CSS is in, not when the first heading renders a second
      // later, so the page header does not reflow when Amiri / Plex / Inter swap in (layout shift).
      // Arabic + Latin sample text pulls both unicode-range subsets. Rendering never waits for this.
      if (document.fonts && document.fonts.load) {
        ['400 1em "IBM Plex Sans Arabic"', '500 1em "IBM Plex Sans Arabic"', '600 1em "IBM Plex Sans Arabic"', '700 1em "IBM Plex Sans Arabic"', '400 1em Amiri', '400 1em Inter', '500 1em Inter', '600 1em Inter', '700 1em Inter']
          .forEach(function (f) { document.fonts.load(f, 'بسم Aa').catch(function () {}) })
      }
    </script>
    <title>نظام أهل القرآن</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
